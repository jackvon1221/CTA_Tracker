<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTA Train Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Our custom CSS will go here later -->
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- This is where the map will be displayed -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Our custom JavaScript will go here later -->
        <script>
        // Initialize the map and set its view to Chicago's coordinates
        const map = L.map('map').setView([41.8781, -87.6298], 13);

        // Add the OpenStreetMap tiles to our map
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Function to fetch train data from our backend
        async function fetchTrainData() {
            try {
                const response = await fetch('/api/trains');
                const data = await response.json();
                console.log("Train data received:", data);
                return data;
            } catch (error) {
                console.error("Failed to fetch train data:", error);
            }
        }

        // Create a marker for Clark/Lake station
        const clarkLakeStation = L.marker([41.8857, -87.6309]).addTo(map);

        // Function to update the popup with live train data
        async function updatePopup() {
            const data = await fetchTrainData();

            if (!data || !data.ctatt.eta) {
                return "<b>Clark/Lake Station</b><br>No data available.";
            }

            // Create HTML content for the popup
            let popupContent = `<b>Clark/Lake Station</b><br><br>`;

            // Add the next 3 trains to the popup content
            data.ctatt.eta.slice(0, 3).forEach(train => {
                // Format the arrival time
                const arrivalTime = new Date(train.arrT).toLocaleTimeString();
                popupContent += `➡️ ${train.destNm} - ${arrivalTime}<br>`;
            });

            return popupContent;
        }

        // Bind a popup that updates with live data when clicked
        clarkLakeStation.bindPopup('Loading arrivals...', {maxWidth: 300});
        clarkLakeStation.on('click', function() {
            // When clicked, update the popup content with fresh data
            updatePopup().then(content => {
                clarkLakeStation.setPopupContent(content);
            });
        });

        // Optional: Fetch data on page load for the console
        fetchTrainData();
    </script>
</body>
</html>
